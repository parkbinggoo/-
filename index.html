<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>백약산 3D — 약초꾼의 길</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2b28; --paper:#f4efe3; --hanji:#ece4d0; --moss:#4c6b3c; --clay:#8a5a3c; --gold:#c9a24a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#cfdcdc;font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  .hide{display:none!important}

  /* Intro */
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:14vh;pointer-events:none;z-index:5}
  #title{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(44px,9vw,96px);letter-spacing:.18em;color:#1d2a27;opacity:0;transition:opacity 2.2s ease, transform 2.2s ease;transform:translateY(10px);text-shadow:0 2px 24px rgba(255,255,255,.6)}
  #title.on{opacity:1;transform:none}
  #subtitle{margin-top:10px;font-family:'Nanum Myeongjo',serif;font-size:clamp(14px,2.4vw,20px);letter-spacing:.3em;color:#2c3d39;opacity:0;transition:opacity 2s ease .6s}
  #subtitle.on{opacity:.85}
  #startBtn{pointer-events:auto;position:fixed;left:50%;bottom:12vh;transform:translateX(-50%);font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:20px;letter-spacing:.3em;padding:16px 34px 16px 40px;background:rgba(244,239,227,.92);color:var(--ink);border:1.5px solid #1f2b28;border-radius:2px;cursor:pointer;opacity:0;transition:opacity 1.2s ease, background .2s;box-shadow:0 10px 30px rgba(20,30,28,.18)}
  #startBtn.on{opacity:1}
  #startBtn:hover{background:#fff}
  #skip{position:fixed;right:18px;bottom:16px;font-size:13px;color:#2c3d39;opacity:.6;pointer-events:none}

  #fade{position:fixed;inset:0;background:#f6f4ee;opacity:0;pointer-events:none;transition:opacity 1s ease;z-index:20}
  #fade.on{opacity:1}

  /* HUD */
  #hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:6}
  .plate{background:rgba(244,239,227,.88);border:1px solid rgba(31,43,40,.25);border-radius:10px;padding:8px 14px;box-shadow:0 6px 18px rgba(20,30,28,.12);backdrop-filter:blur(4px)}
  #alt{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:22px;letter-spacing:.04em}
  #alt small{font-family:'Gowun Dodum';font-weight:400;font-size:12px;opacity:.7;margin-right:6px;letter-spacing:.1em}
  #count{font-size:13px;opacity:.8;margin-top:2px}
  .btns{display:flex;gap:8px;pointer-events:auto}
  .btn{pointer-events:auto;cursor:pointer;font-family:'Gowun Dodum';font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid rgba(31,43,40,.3);background:rgba(244,239,227,.92);color:var(--ink);box-shadow:0 6px 18px rgba(20,30,28,.12)}
  .btn:hover{background:#fff}

  #toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-10px);font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:16px;letter-spacing:.08em;padding:10px 20px;border-radius:6px;background:rgba(244,239,227,.95);border:1px solid rgba(31,43,40,.3);opacity:0;transition:opacity .4s, transform .4s;pointer-events:none;z-index:7}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* found card */
  #found{position:fixed;left:50%;top:40%;transform:translate(-50%,-46%) scale(.92);width:min(320px,86vw);background:var(--paper);border:1.5px solid #1f2b28;border-radius:4px;padding:18px 18px 20px;text-align:center;opacity:0;pointer-events:none;transition:opacity .35s ease, transform .45s cubic-bezier(.2,1.4,.4,1);z-index:9;box-shadow:0 30px 60px rgba(20,30,28,.28)}
  #found.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  #found .tag{font-size:12px;letter-spacing:.3em;opacity:.65}
  #found h2{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:34px;letter-spacing:.12em;margin:4px 0 2px}
  #found .rar{color:var(--gold);letter-spacing:.2em;font-size:14px}
  #found p{font-size:14px;line-height:1.6;margin-top:8px;opacity:.85}
  #found canvas{position:static;width:180px;height:150px;margin:6px auto 0;display:block;background:radial-gradient(circle at 50% 60%, #fffaf0 0%, #ece4d0 70%);border-radius:50%}
  #found.legend{border-color:#b8892b;box-shadow:0 0 0 4px rgba(201,162,74,.35),0 30px 60px rgba(20,30,28,.28)}
  #found.legend h2{color:#8a2a1a}

  /* bag */
  #bag{position:fixed;inset:0;background:rgba(20,28,26,.45);display:flex;align-items:center;justify-content:center;z-index:10}
  #bag .sheet{width:min(720px,94vw);max-height:86vh;overflow:auto;background:var(--paper);border:1.5px solid #1f2b28;border-radius:4px;padding:20px}
  #bag h3{font-family:'Nanum Myeongjo',serif;font-size:24px;letter-spacing:.2em;display:flex;justify-content:space-between;align-items:center}
  #bag h4{font-size:13px;letter-spacing:.3em;opacity:.6;margin:16px 0 8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
  .card{background:var(--hanji);border-radius:6px;padding:8px 6px 10px;text-align:center;border:1px solid rgba(31,43,40,.12)}
  .card canvas,.card img{position:static;width:96px;height:80px;display:block;margin:0 auto;object-fit:contain}
  .card.unk img{filter:brightness(0) opacity(.22)}
  .card .hb{font-size:10.5px;opacity:.6;margin-top:3px;line-height:1.35}
  .card .n{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:15px;margin-top:2px}
  .card .c{font-size:12px;opacity:.7}
  .card.unk .n{opacity:.4}

  /* touch pad */
  #pad{position:fixed;bottom:18px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;z-index:6}
  #pad button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:1px solid rgba(31,43,40,.35);background:rgba(244,239,227,.8);font-size:24px;color:var(--ink);box-shadow:0 6px 18px rgba(20,30,28,.15)}
  #pad button:active{background:#fff}

  body{background:linear-gradient(#b9d3df,#eef1e7)}
  #startPanel{pointer-events:auto;position:fixed;left:50%;bottom:9vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transition:opacity 1.2s ease}
  #startPanel.on{opacity:1}
  #startPanel .row{display:flex;gap:10px;align-items:center;background:rgba(244,239,227,.88);padding:8px 12px;border-radius:999px;border:1px solid rgba(31,43,40,.25)}
  #nick{font-family:'Gowun Dodum';font-size:15px;border:none;background:transparent;outline:none;width:150px;color:var(--ink)}
  .sw{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.8);cursor:pointer;box-shadow:0 0 0 1px rgba(31,43,40,.3)}
  .sw.on{box-shadow:0 0 0 2px #1f2b28}
  #startBtn{position:static;transform:none;opacity:1}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:4}
  .wl{position:absolute;left:0;top:0;white-space:nowrap;font-family:'Gowun Dodum';font-size:14px;color:#1f2b28;text-shadow:0 0 4px #fff,0 0 8px #fff}
  .wl.pip{font-size:15px;letter-spacing:2px;color:#2f4a3a}
  .wl.msg{font-family:'Nanum Myeongjo',serif;font-weight:700;background:rgba(244,239,227,.92);padding:4px 10px;border-radius:6px;text-shadow:none;border:1px solid rgba(31,43,40,.2)}
  .nametag{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;padding:3px 8px;border-radius:999px;background:rgba(31,43,40,.7);color:#f4efe3}
  #people{margin-top:6px;font-size:12px;opacity:.85}
  #connection{font-size:12px;margin-top:3px;opacity:.85}
  #weather{font-size:12px;margin-top:3px;opacity:.85}
  #joy{position:fixed;left:22px;bottom:26px;width:120px;height:120px;border-radius:50%;background:rgba(244,239,227,.35);border:1.5px solid rgba(244,239,227,.8);z-index:6;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(244,239,227,.9);box-shadow:0 4px 12px rgba(0,0,0,.2)}
  #help{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,28,26,.4);z-index:11}
  #help .sheet{background:var(--paper);border:1.5px solid #1f2b28;border-radius:4px;padding:20px 24px;max-width:420px;line-height:1.9;font-size:14px}
  #help h3{font-family:'Nanum Myeongjo',serif;letter-spacing:.2em;margin-bottom:6px}
  #help b{display:inline-block;min-width:110px}

  #mapView{position:fixed;inset:0;background:rgba(20,28,26,.45);display:flex;align-items:center;justify-content:center;z-index:10}
  .mapsheet{background:var(--paper);border:1.5px solid #1f2b28;border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:96vw;max-height:96vh}
  .mhead{display:flex;align-items:center;gap:12px}.mhead b{font-family:'Nanum Myeongjo',serif;font-size:22px;letter-spacing:.2em}.mhead .mkey{font-size:12px;opacity:.55;flex:1}
  .mwrap{position:relative}#mapC{position:static;display:block;width:min(680px,92vw,calc(96vh - 90px));height:auto;aspect-ratio:1;border:1px solid rgba(31,43,40,.4);border-radius:3px}
  #found{z-index:12}
  .card.click{cursor:pointer;transition:transform .15s,box-shadow .15s}.card.click:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(31,43,40,.15)}

  #clock{font-size:12.5px;opacity:.85;margin-top:2px;letter-spacing:.02em}
  #ecoBtn.on{background:#2f4a3a;color:#f4efe3;border-color:#2f4a3a}
  #jumpBtn{position:fixed;right:calc(22px + env(safe-area-inset-right));bottom:calc(36px + env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;border:1.5px solid rgba(244,239,227,.85);background:rgba(244,239,227,.42);color:#1f2b28;font-family:'Gowun Dodum';font-size:15px;font-weight:700;z-index:6;touch-action:none;box-shadow:0 6px 16px rgba(0,0,0,.18)}
  #jumpBtn:active{background:rgba(244,239,227,.85)}
  #hud{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));right:calc(14px + env(safe-area-inset-right))}
  #joy{left:calc(22px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom))}
  @media (max-width:760px),(pointer:coarse){
    #hud{top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));gap:6px}
    .plate{padding:6px 10px;border-radius:9px}#alt{font-size:18px}#clock,#count{font-size:11px}
    .btns{gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:58vw}.btn{font-size:12.5px;padding:9px 11px;min-height:40px;border-radius:9px}
    #joy{width:132px;height:132px}#knob{width:58px;height:58px;margin:-29px 0 0 -29px}
    #toast{top:calc(64px + env(safe-area-inset-top));font-size:13px;max-width:88vw;white-space:normal;text-align:center}
    #found{width:min(320px,88vw);padding:14px 14px 16px}#found canvas{width:160px;height:133px}#found h2{font-size:28px}#found p{font-size:13px}
    #bag .sheet{width:100vw;max-height:none;height:100%;border:none;border-radius:0;padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom))}
    #bag{align-items:stretch}.grid{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
    .mapsheet{width:100vw;max-width:none;max-height:none;height:100%;border:none;border-radius:0;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));align-items:center}
    .mhead{width:100%}#mapC{width:min(96vw,calc(100vh - 120px))}
    .wl{font-size:13px}#startPanel{width:92vw}#startPanel .row{flex-wrap:wrap;justify-content:center;border-radius:14px}#nick{width:130px}
  }
  @media (pointer:coarse){.mkey{display:none}#mapView .mapsheet{justify-content:flex-start}.mwrap{margin-top:auto;margin-bottom:auto}.card .c{font-size:11px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>

<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div id="intro">
  <div id="title">백약산</div>
  <div id="subtitle">구름이 걷히면, 산이 길을 연다</div>
  <div id="startPanel">
    <div class="row"><input id="nick" maxlength="12" placeholder="별호 (닉네임)"><span style="font-size:12px;opacity:.7">바람막이</span><div id="swatches" style="display:flex;gap:6px"></div></div>
    <button id="startBtn">산에 오르다</button>
  </div>
  <div id="skip">화면을 누르면 건너뜁니다</div>
</div>

<div id="hud" class="hide">
  <div class="plate">
    <div id="alt"><small>해발</small>0m</div>
    <div id="clock"></div>
    <div id="weather">날씨 확인 중</div>
    <div id="connection" class="hide"></div>
    <div id="count">채집 0</div>

  </div>
  <div class="btns">
    <button class="btn" id="homeBtn" title="이동이 막힐 때 산 입구로 돌아가기">입구</button>
    <button class="btn" id="ecoBtn">절전</button>
    <button class="btn" id="mapBtn">지도</button>
    <button class="btn" id="bagBtn">가방 · 도감</button>
  </div>
</div>

<div id="toast"></div>
<div id="joy" class="hide"><div id="knob"></div></div>
<button id="jumpBtn" class="hide">점프</button>

<div id="found">
  <div class="tag" id="fTag">채집 성공</div>
  <canvas id="fCanvas" width="360" height="300"></canvas>
  <h2 id="fName">도라지</h2>
  <div class="rar" id="fRar">★</div>
  <p id="fDesc"></p><p id="fMeta" style="font-size:12px;opacity:.65;margin-top:4px"></p><button class="btn hide" id="fClose" style="margin-top:12px">닫기</button>
</div>

<div id="bag" class="hide">
  <div class="sheet">
    <h3>가방 · 도감 <button class="btn" id="bagClose">닫기</button></h3>
    <div id="bagBody"></div>
  </div>
</div>



<div id="mapView" class="hide"><div class="sheet mapsheet">
  <div class="mhead"><b>지도</b><span class="mkey">M 키로 열고 닫기</span><button class="btn" id="mapClose">닫기</button></div>
  <div class="mwrap"><canvas id="mapC" width="680" height="680"></canvas></div>
</div></div>
<div id="fade"></div>
<script>
(()=>{
'use strict';
if(!window.THREE){document.body.innerHTML='<p style="padding:40px;font-family:sans-serif">3D 엔진을 불러오지 못했습니다. 새로고침해 주세요.</p>';return}
/* ================= DATA ================= */
const HERBS = {
  sansam:  {name:'산삼',  w:1.6, need:6, rar:5, root:true,  desc:'깊은 그늘에서 수십 년을 버틴 뿌리. 붉은 열매가 신호다. 심봤다!'},
  deodeok: {name:'더덕',  w:8,   need:4, rar:3, root:true,  desc:'덩굴을 살짝 당기면 쌉싸름한 향이 먼저 올라온다.'},
  doraji:  {name:'도라지',w:9,   need:4, rar:3, root:true,  desc:'보랏빛 별꽃 아래 하얀 뿌리. 목이 칼칼할 때 달여 먹던 약초.'},
  dunggule:{name:'둥굴레',w:7,   need:4, rar:3, root:true,  desc:'휘어진 줄기 아래 종처럼 매달린 꽃. 뿌리는 구수한 차가 된다.'},
  gomchwi: {name:'곰취',  w:9,   need:3, rar:2, root:false, desc:'곰이 즐겨 먹는다는 넓은 잎. 쌈 한 장에 산 냄새가 가득하다.'},
  chamchwi:{name:'참취',  w:10,  need:3, rar:2, root:false, desc:'나물 중의 으뜸. 데쳐서 들기름에 무치면 봄이 입안에 핀다.'},
  gosari:  {name:'고사리',w:12,  need:3, rar:1, root:false, desc:'주먹 쥔 새순. 봄 산이 가장 먼저 내미는 인사.'},
  dallae:  {name:'달래',  w:11,  need:3, rar:1, root:true,  desc:'알싸한 작은 알뿌리. 간장에 송송 썰어 넣으면 달래장.'},
  naengi:  {name:'냉이',  w:13,  need:3, rar:1, root:true,  desc:'언 땅을 뚫고 나온 첫 향기. 된장국에 한 줌.'},
  ssuk:    {name:'쑥',    w:14,  need:3, rar:1, root:false, desc:'단군 신화의 그 풀. 떡에도, 국에도, 뜸에도.'},
};
const MUSH = {
  pyogo:    {name:'표고버섯',  w:10, need:3, rar:2, desc:'참나무 둥치에서 자란 갈색 갓. 갈라진 흰 무늬가 상품의 증거.'},
  neutari:  {name:'느타리버섯',w:10, need:3, rar:1, desc:'겹겹이 포개진 회색 부채. 결대로 찢어 볶으면 쫄깃하다.'},
  mogi:     {name:'목이버섯',  w:9,  need:3, rar:1, desc:'나무의 귀를 닮은 검은 버섯. 꼬들꼬들한 식감.'},
  yeongji:  {name:'영지버섯',  w:4,  need:5, rar:4, desc:'옻칠한 듯 윤이 나는 붉은 갓. 예부터 불로초라 불렸다.'},
  sanghwang:{name:'상황버섯',  w:1.6,need:6, rar:5, desc:'뽕나무에 말발굽처럼 붙은 노란 버섯. 산에서도 만나기 어렵다.'},
};
const HERB_KEYS = Object.keys(HERBS), MUSH_KEYS = Object.keys(MUSH);


/* ================= UTIL ================= */
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function rngOf(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pickW(table, keys, r, boost){
  let tot=0; const ws=keys.map(k=>{let w=table[k].w; if(table[k].rar>=4) w*=boost; tot+=w; return w});
  let x=r*tot; for(let i=0;i<keys.length;i++){x-=ws[i]; if(x<=0) return keys[i]} return keys[keys.length-1];
}
function mixHex(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const r=Math.round(lerp(pa>>16,pb>>16,t)),g=Math.round(lerp(pa>>8&255,pb>>8&255,t)),bl=Math.round(lerp(pa&255,pb&255,t));
  return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1)}


/* ================= AUDIO ================= */
let AC=null, soundOn=true;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} return AC }
function tone(f,dur,type='sine',vol=.12,slide=0,delay=0){
  if(!soundOn) return; const a=ac(); if(!a) return;
  const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}

function makeMountain(radius,height,seed,col,snowCol,opts={}){
  const seg=opts.seg||14, hs=opts.hs||8;
  const geo=new THREE.ConeGeometry(radius,height,seg,hs,true);
  geo.translate(0,height/2,0);
  const pos=geo.attributes.position, r=rngOf(seed), cols=new Float32Array(pos.count*3);
  const cA=new THREE.Color(col), cS=new THREE.Color(snowCol||0xf4f4ef), cB=new THREE.Color(col).multiplyScalar(.75);
  for(let i=0;i<pos.count;i++){
    let x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
    const k=y/height; const ang=Math.atan2(z,x);
    if(k<.999){const n=1+.18*Math.sin(ang*3+seed)+.12*Math.sin(ang*7+seed*2)+.08*(r()-.5);const rr=Math.sqrt(x*x+z*z)*n;x=Math.cos(ang)*rr;z=Math.sin(ang)*rr;y+=(r()-.5)*height*.04*(1-k)}
    pos.setXYZ(i,x,y,z);
    const c=cB.clone().lerp(cA,k); if(snowCol&&k>(opts.snowLine||.78)) c.lerp(cS,clamp((k-(opts.snowLine||.78))*6,0,1));
    cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(cols,3));geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({vertexColors:true,flatShading:true,shininess:0,specular:0x000000,fog:opts.fog!==false}));
  return m;
}

  mk(new THREE.SphereGeometry(.126,14,10,Math.PI,Math.PI,Math.PI*.3,Math.PI*.42),hair,head,0,-.005,-.006);   // back of head hair
  for(const s of [-1,1]){mk(new THREE.SphereGeometry(.03,8,6),skin,head,s*.125,-.01,0).scale.set(.5,1,.8);   // ears

  const logo=mk(new THREE.ConeGeometry(.03,.035,3),T(0xf2f2ee),bp,0,.17,-.115);logo.rotation.x=-Math.PI/2;logo.scale.set(1,.2,1); // simple mountain mark
  box(.34,.09,.24,pack,bp,0,.31,-.01);box(.35,.02,.25,grey,bp,0,.27,-.01);       // top lid
  box(.34,.05,.2,black,bp,0,-.29,0);                                              // bottom
  for(const s of [-1,1]){const mesh=box(.05,.2,.16,T(0x4a4f55,{transparent:true,opacity:.85}),bp,s*.205,-.15,.0);
    for(const y of [.12,-.02])box(.05,.016,.23,greyD,bp,s*.18,y,0)}               // side mesh pockets, compression straps
  box(.2,.06,.03,grey,bp,0,.36,.08);                                              // haul loop
  for(const s of [-1,1]){const st=box(.06,.5,.03,grey,torso,s*.12,.45,.2);st.rotation.x=-.12;const st2=box(.06,.16,.08,grey,torso,s*.12,.65,.08)}  // shoulder straps

function setGreens(h,n){n=Math.min(6,n);if(h.nGreens===n)return;h.nGreens=n;while(h.greens.children.length)h.greens.remove(h.greens.children[0]);
  for(let i=0;i<n;i++){leafM(h.greens,0,0,(i-2.5)*.025,.2,.05,i*.5,1.3,M(i%2?0x5a8a3a:0x6fa046))}}
const DIG_T=.55;
function poseHiker(h,dt,speed){
  h.t+=dt;let lL=0,lR=0,aL=.08,aR=.08,aLz=.12,aRz=-.12,by=0,lean=0,hd=0;
  if(h.mode==='walk'){h.phase+=dt*(2.6+speed*1.6);const s=Math.sin(h.phase);lL=s*.6;lR=-s*.6;aL=-s*.45;aR=s*.45;by=Math.abs(Math.cos(h.phase))*.035;lean=.1;h.torso.rotation.z=Math.sin(h.phase)*.03}
  else if(h.mode==='dig'){const k=h.t/DIG_T;aR=k<.5?lerp(.1,-2.7,ease(k/.5)):k<.7?lerp(-2.7,-.55,(k-.5)/.2):-.55;aL=k<.5?lerp(0,-1.2,k*2):-.4;lean=k>.5?.45:.1;lL=.3;lR=-.2;hd=.2}
  else if(h.mode==='joy'){const k=h.t;by=Math.abs(Math.sin(k*7))*.42*Math.max(0,1-k/2.2);aL=-2.85+Math.sin(k*16)*.15;aR=-2.85-Math.sin(k*16)*.15;aLz=-.45;aRz=.45;lL=-.5*Math.abs(Math.sin(k*7));lR=lL;lean=-.12;hd=-.25}
  const f=1-Math.exp(-dt*(h.mode==='dig'?40:14));
  h.legL.rotation.x=lerp(h.legL.rotation.x,lL,f);h.legR.rotation.x=lerp(h.legR.rotation.x,lR,f);
  h.armL.rotation.x=lerp(h.armL.rotation.x,aL,f);h.armR.rotation.x=lerp(h.armR.rotation.x,aR,f);
  h.armL.rotation.z=lerp(h.armL.rotation.z,aLz,f);h.armR.rotation.z=lerp(h.armR.rotation.z,aRz,f);
  h.body.position.y=lerp(h.body.position.y,by,h.mode==='joy'?1:f);h.torso.rotation.x=lerp(h.torso.rotation.x,lean,f);h.head.rotation.x=lerp(h.head.rotation.x,hd,f);
  if(h.mode!=='walk')h.torso.rotation.z*=.85;h.mouth.scale.setScalar(h.mode==='joy'?1.7:1);if(h.mode==='idle'){h.head.rotation.y=Math.sin(h.t*.5)*.35;h.head.rotation.z=0;h.body.scale.y=1+Math.sin(h.t*2)*.006}else{h.head.rotation.y*=.9;h.body.scale.y=1}
}

}
let last=performance.now();
let lastDraw=0;
function frame(now){requestAnimationFrame(frame);
  const covered=mapOpen||!$('bag').classList.contains('hide'),cap=covered?8:PERF.fps;
  if(now-lastDraw<1000/cap-2)return;lastDraw=now;
  const raw=(now-last)/1000,dt=Math.min(.05,raw);last=now;clock+=dt;
  if(mode==='intro')drawIntro(Math.min(.25,raw));else{updateGame(dt);renderer.render(scene,camera)}}
addEventListener('resize',onResize);applyPerf();requestAnimationFrame(frame);
$('ecoBtn').onclick=()=>{PERF.eco=!PERF.eco;applyPerf();chunkKey='';toast(PERF.eco?'절전 모드: 화질과 시야를 줄여 가볍게 돌립니다':'절전 모드 해제')};
function jump(){if(mode==='game'&&!P.air&&me.mode!=='dig'){P.vy=5.2;P.air=true}}
function returnToEntrance(){if(mode!=='game')return;P.x=pathX(24);P.z=24;P.y=H(P.x,P.z);P.vy=0;P.air=false;target=null;pending=null;me.mode='idle';camYaw=Math.PI;toast('입구로 돌아왔습니다');sendPresence(true)}
addEventListener('keydown',e=>{if(e.code==='KeyR'&&mode==='game'&&e.target.tagName!=='INPUT')returnToEntrance()});
$('homeBtn').onclick=returnToEntrance;
$('jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();jump()});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(!AMB)return;if(document.hidden)AMB.a.suspend();else AMB.a.resume()});

})();
</script>
</body>
